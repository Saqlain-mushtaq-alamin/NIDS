    total_fwd_packets: {kind: direct, columns: ["IN_PKTS"]}
    total_bwd_packets: {kind: direct, columns: ["OUT_PKTS"]}
    total_length_of_fwd_packets: {kind: direct, columns: ["IN_BYTES"]}
    total_length_of_bwd_packets: {kind: direct, columns: ["OUT_BYTES"]}
    fwd_packet_length_min: {kind: direct, columns: ["MIN_IP_PKT_LEN"]}
    fwd_packet_length_max: {kind: direct, columns: ["MAX_IP_PKT_LEN"]}
    down_up_ratio: {kind: ratio, columns: ["OUT_BYTES", "IN_BYTES"]}
    flow_bytes_per_sec: {kind: direct, columns: ["SRC_TO_DST_AVG_THROUGHPUT"]}

  nf-cse-cic-ids2018-v2:
