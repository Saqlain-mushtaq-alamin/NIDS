# configs/datasets.yaml — Dataset registry and metadata

datasets:
  cic-ids-2017:
    name: "CIC-IDS2017"
    source_url: "https://www.unb.ca/cic/datasets/ids-2017.html"
    download_date: "2026-09-01"
    local_dir: "data/raw/cic-ids-2017"
    file_pattern: "*.csv"
    label_column: "Label"
    documented_noise_rate: 0.0667
    notes: "Raw baseline dataset. Standard UNB benchmark."

  lycos-ids-2017:
    name: "LYCOS-IDS2017 (Corrected)"
    source_url: "https://dl.acm.org/doi/fullHtml/10.1145/3486622.3493973"
    download_date: "2026-09-01"
    local_dir: "data/raw/lycos-ids-2017"
    file_pattern: "*.csv"
    label_column: "Label"
    notes: "Cleaned/relabeled version addressing CIC-IDS2017 label corruption."

  unsw-nb15:
    name: "UNSW-NB15"
    source_url: "https://research.unsw.edu.au/projects/unsw-nb15-dataset"
    download_date: "2026-09-01"
    local_dir: "data/raw/unsw-nb15"
    file_pattern: "*.csv"
    label_column: "attack_cat"
    notes: "Cross-domain evaluation dataset."

  ctu-13:
    name: "CTU-13"
    source_url: "https://www.stratosphereips.org/datasets-ctu13"
    download_date: "2026-09-01"
    local_dir: "data/raw/ctu-13"
    file_pattern: "*.csv"
    label_column: "label"
    notes: "Botnet C2 and encrypted traffic benchmark dataset."

  lab-simulated:
    name: "Lab-Simulated Traffic Dataset"
    local_dir: "data/lab_captures"
    file_pattern: "*.csv"
    label_column: "label"
    notes: "Simulated traffic generated from behavioral model (not physical capture)."

  lab-captured:
    name: "Lab-Simulated Traffic Dataset (Legacy Alias)"
    local_dir: "data/lab_captures"
    file_pattern: "*.csv"
    label_column: "label"
    notes: "Legacy alias for lab-simulated."

  nf-unsw-nb15-v2:
    name: "NF-UNSW-NB15-v2"
    source_url: "https://staff.itee.uq.edu.au/marius/NIDS_datasets/"
    local_dir: "data/raw/nf-unsw-nb15-v2"
    file_pattern: "*.csv"
    label_column: "Attack"
    notes: "NetFlow-v2 representation of UNSW-NB15 (43 features)."

  nf-cse-cic-ids2018-v2:
    name: "NF-CSE-CIC-IDS2018-v2"
    source_url: "https://staff.itee.uq.edu.au/marius/NIDS_datasets/"
    local_dir: "data/raw/nf-cse-cic-ids2018-v2"
    file_pattern: "*.csv"
    label_column: "Attack"
    notes: "NetFlow-v2 representation of CSE-CIC-IDS2018 (43 features)."

  nf-ton-iot-v2:
    name: "NF-ToN-IoT-v2"
    source_url: "https://staff.itee.uq.edu.au/marius/NIDS_datasets/"
    local_dir: "data/raw/nf-ton-iot-v2"
    file_pattern: "*.csv"
    label_column: "Attack"
    notes: "NetFlow-v2 representation of ToN-IoT (43 features)."
